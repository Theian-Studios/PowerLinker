name: CI

on:
  pull_request:
    branches: [prd, stg, dev]
    types: [opened, reopened, synchronize, edited]
    paths-ignore: # Pushes that include only these changed files won't trigger actions
      - "**/README.md"
      - "**/.gitignore"
      - "**/doc/*"
env:
  tf_version: ">=1.4.5" # must match value in terraform/modules/app/main.tf

jobs:
  env:
    name: Set Env Vars
    runs-on: ubuntu-latest
    steps:
      - name: Get Current Timestamp
        id: date
        run: echo "timestamp=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Set up PRD Environment Variables
        if: ${{ github.base_ref == 'prd' }}
        # Replace the app_name with the project name
        run: |
          matrix='{
            "env":[
              {
                "environment_name":"prd",
                "app_name":"rllpowerlinker",
                "tf_working_dir":"./terraform/prd",
                "aws_account":"112065100358",
                "aws_gha_role":"byuawsrll-prd-gha",
                "image_tag":"${{ steps.date.outputs.timestamp }}"
              }
            ]
          }'
          echo matrix=`echo $matrix | jq -c .` >> $GITHUB_ENV

      - name: Set up STG Environment Variables
        if: ${{ github.base_ref == 'stg' || 'dev' }}
        # could change environment_name to github.base_ref
        run: |
          matrix='{
            "env":[
              {
                "environment_name":"stg",
                "app_name":"rllpowerlinker",
                "tf_working_dir":"./terraform/stg",
                "aws_account":"125482557192",
                "aws_gha_role":"byuawsrll-stg-gha",
                "image_tag":"${{ steps.date.outputs.timestamp }}"
              }
            ]
          }'
          echo matrix=`echo $matrix | jq -c .` >> $GITHUB_ENV

    outputs:
      matrix: ${{ env.matrix }}

  changes:
    name: Find File Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      # For pull requests it's not necessary to checkout the code
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker/**'
            frontend:
              - 'frontend/**'

  format:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          sparse-checkout: |
            terraform
            
      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3
        with:
            terraform_version: ${{ env.tf_version }}
      - name: Check Terraform Formatting
        working-directory: "./terraform"
        run: terraform fmt -check -recursive
  
  checkMeds:
    name: Check Meds (merge every day)
    runs-on: ubuntu-latest
    steps:
        - name: Check Meds
          uses: byuawsfhtl/MedsAction@v1.0.0

  standardCheck:
    name: Python Standard Check
    runs-on: ubuntu-latest
    steps:
      - name: Follow Python Standard
        uses: byuawsfhtl/PythonStandardAction@v1.2.0

  checkTests:
    name: Test Coverage Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RLL_BOT_PA_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.RLL_BOT_PA_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          # Create temporary requirements file with authentication
          sed "s|https://github.com/byuawsfhtl/|https://x-access-token:$GITHUB_TOKEN@github.com/byuawsfhtl/|g" backend/requirements.txt > requirements_auth.txt
          sed "s|https://github.com/byuawsfhtl/|https://x-access-token:$GITHUB_TOKEN@github.com/byuawsfhtl/|g" backend/dev_requirements.txt > dev_requirements_auth.txt

          pip install -r requirements_auth.txt
          pip install -r dev_requirements_auth.txt

      - name: Check Test Coverage
        uses: byuawsfhtl/TestCoverageAction@v1.0.0
        with:
          exclude_paths: .cursor/*, .github/*, .vscode/*, frontend/*, terraform/*, docker/*, **/host_locally.py, **/tempUpload.py, **/__init__.py, **/tests/*, *.json, **/main.py, **/awsSession.py, **/Hint.py, **/ParameterService.py


  docker:
    name: Docker Build
    needs: [changes, env]
    strategy:
      matrix: ${{ fromJson(needs.env.outputs.matrix) }}
      fail-fast: false
    environment:
      name: ${{ matrix.env.environment_name }}
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          sparse-checkout: |
            backend
            docker

      - name: Build the Docker image
        run: |
          docker build . --file docker/Dockerfile --build-arg RLL_BOT_PA_TOKEN=${{ secrets.RLL_BOT_PA_TOKEN }} --build-arg ENV=${{ matrix.env.environment_name }}

  react:
    name: React Build
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          sparse-checkout: |
            frontend

      - name: Build the React app
        working-directory: "frontend"
        run: |
          npm ci
          npm run build --if-present

      - name: Run ESLint
        working-directory: "frontend"
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        run: npm run lint

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [env, format, docker]
    strategy:
      matrix: ${{ fromJson(needs.env.outputs.matrix) }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v3
        with:
          sparse-checkout: |
            terraform

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.1
        with:
          role-to-assume: "arn:aws:iam::${{ matrix.env.aws_account }}:role/${{ matrix.env.aws_gha_role }}"
          role-session-name: ${{ github.sha }}
          aws-region: us-west-2

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: ${{ env.tf_version }}

      - name: Terraform Init
        working-directory: "${{ matrix.env.tf_working_dir }}"
        run: terraform init

      - name: Terraform Plan
        working-directory: "${{ matrix.env.tf_working_dir }}"
        run: terraform plan -var 'image_tag=${{ matrix.env.image_tag }}' -input=false -out=plan

      - name: Comment Terraform Plan
        uses: byu-oit/github-action-tf-plan-comment@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: "${{ matrix.env.tf_working_dir }}"
          terraform-plan-file: plan
