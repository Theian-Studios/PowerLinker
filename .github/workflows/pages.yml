name: Pages

# Publishes the public PowerLinker site to GitHub Pages, backed by the results Google Sheet.
# Runs only on main, so the lab's prd/stg/dev deploys are unaffected.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc
      # SHEETS_URL is a repository variable: the Apps Script web app address (see sheets/README.md)
      - run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          VITE_SHEETS_URL: ${{ vars.SHEETS_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
