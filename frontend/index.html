<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Power Linker</title>
    <!-- The lab's tree on the browser tab, a phone's home screen, and link previews in messages and email -->
    <link rel="icon" type="image/png" href="%BASE_URL%RLL_Logo.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta property="og:title" content="PowerLinker" />
    <meta property="og:description" content="Help families find their ancestors by matching people in historical records." />
    <meta property="og:image" content="https://theian-studios.github.io%BASE_URL%og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // On the public site, ask the Sheet for the first hints right away, while the app's code is still
      // loading; the app takes over this request (takeEarlyRequest in useLambdaFetch.ts), so the query must be
      // the one the app would send. The Sheet hands out the next hints from one shared position whatever the
      // query says; last_insert_time and start=random are from before it did.
      (function () {
        var url = "%VITE_SHEETS_URL%";
        if (!url || url.charAt(0) === "%") return;
        // The Chilean site asks for its Chile hints; the query the app compares stays the same
        var region = "%VITE_REGION%" === "cl" ? "&region=cl" : "";
        // Apps Script sends every answer on to googleusercontent.com, so connect to it now rather than after
        // the first reply
        if (url.indexOf("https://script.google.com/") === 0) {
          var link = document.createElement("link");
          link.rel = "preconnect";
          link.href = "https://script.googleusercontent.com";
          link.crossOrigin = "anonymous";
          document.head.appendChild(link);
        }
        try {
          // Records keep their own place, under keys ending in ".records" (sheetsApi.ts)
          // The Chilean site has only duplicates for now
          var type = !region && localStorage.getItem("powerlinker.hintType") === "record_attachment" ? "record_attachment" : "possible_duplicate";
          var suffix = (type === "record_attachment" ? ".records" : "") + region.replace("&region=", ".");
          var after = Number(localStorage.getItem("powerlinker.cursor" + suffix));
          if (!(after > 0)) after = -1;
          var upcoming = JSON.parse(localStorage.getItem("powerlinker.upcoming" + suffix) || "[]");
          for (var i = 0; i < upcoming.length; i++) {
            if (upcoming[i]["insert-time"] > after) after = upcoming[i]["insert-time"];
          }
          var query = "?record_type=" + type + "&last_insert_time=" + after + "&count=20" +
            (after < 0 ? "&start=random" : "") + "&with_check=true";
          window.powerlinkerFirstHints = {
            query: query,
            response: fetch(url + query + region, { credentials: "omit" })
              .then(function (r) { return r.ok ? r.json().then(function (data) { return { ok: true, data: data }; }) : null; })
              .catch(function () { return null; }),
          };
        } catch (e) {
          // Storage blocked or no fetch: the app asks for hints itself
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
