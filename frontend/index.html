<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Power Linker</title>
    <script>
      // On the public site, ask the Sheet for the first hints right away, while the app's code is still
      // loading; the app takes over this request (takeEarlyRequest in useLambdaFetch.ts), so the query must be
      // the one the app would send. The Sheet hands out the next hints from one shared position whatever the
      // query says; last_insert_time and start=random are from before it did.
      (function () {
        var url = "%VITE_SHEETS_URL%";
        if (!url || url.charAt(0) === "%") return;
        // Apps Script sends every answer on to googleusercontent.com, so connect to it now rather than after
        // the first reply
        if (url.indexOf("https://script.google.com/") === 0) {
          var link = document.createElement("link");
          link.rel = "preconnect";
          link.href = "https://script.googleusercontent.com";
          link.crossOrigin = "anonymous";
          document.head.appendChild(link);
        }
        try {
          var after = Number(localStorage.getItem("powerlinker.cursor"));
          if (!(after > 0)) after = -1;
          var upcoming = JSON.parse(localStorage.getItem("powerlinker.upcoming") || "[]");
          for (var i = 0; i < upcoming.length; i++) {
            if (upcoming[i]["insert-time"] > after) after = upcoming[i]["insert-time"];
          }
          var query = "?record_type=possible_duplicate&last_insert_time=" + after + "&count=20" +
            (after < 0 ? "&start=random" : "") + "&with_check=true";
          window.powerlinkerFirstHints = {
            query: query,
            response: fetch(url + query, { credentials: "omit" })
              .then(function (r) { return r.ok ? r.json().then(function (data) { return { ok: true, data: data }; }) : null; })
              .catch(function () { return null; }),
          };
        } catch (e) {
          // Storage blocked or no fetch: the app asks for hints itself
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
